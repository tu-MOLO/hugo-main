baseURL: https://tu-molo.github.io/
title: 张昊-MOLO
copyright: MOLO

# 站点语言
locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true

theme: hugo-theme-stack

pagination:
    pagerSize: 5

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    description: 张昊（MOLO）的个人博客，记录学习与折腾过程。

    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /favicon.ico

    footer:
        since: 2025
        customText: MOLO 的个人网站

    dateFormat:
        published: 2006-01-02
        lastUpdated: 2006-01-02 15:04

    sidebar:
        emoji: 🥰
        subtitle: 欢迎来到 MOLO 的个人网站
        avatar:
            enabled: true
            local: true
            src: img/avatar.png

    article:
        math: true
        toc: true
        readingTime: true
        license:
            enabled: true
            default: MOLO

    comments:
        enabled: false

    widgets:
        homepage:
            - type: search
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 20
        page:
            - type: toc

    colorScheme:
        toggle: false
        default: dark

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

menu:
    main: []

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/tu-MOLO
          params:
              icon: brand-github

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100
        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
